<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planification Voyage</title>
    <link rel="stylesheet" href="index.css">
    
</head>
<body>
    <header>
        <h1>PLANIFICATION VOYAGE</h1>
    </header>

    <main>
        <div class="carousel-container">
            <div class="carousel" id="carousel">
                <div class="travel-card" onclick="window.open('niagara2025.html', '_blank')">
                    <div class="status-badge completed">COMPLÉTÉ</div>
                    <img src="https://www.niagarafallstourism.com/sites/default/files/2024-05/rob-anzit-photography-niagara-falls-journey-behind-the-falls-62.jpg" alt="Niagara Falls" class="card-image">
                    <div class="card-overlay">
                        <div class="card-text">
                            <div class="card-title">Niagara</div>
                            <div class="card-subtitle">2025</div>
                        </div>
                    </div>
                </div>

                <div class="travel-card" onclick="window.open('omra2025.html', '_blank')">
                    <div class="status-badge upcoming">TERMINÉ</div>
                    <img src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/04/5b/74/6d/caption.jpg?w=600&h=400&s=1" alt="Omra" class="card-image">
                    <div class="card-overlay">
                        <div class="card-text">
                            <div class="card-title">Omra</div>
                            <div class="card-subtitle">2025</div>
                        </div>
                    </div>
                </div>

                

            <div class="navigation">
                <button class="nav-btn" onclick="scrollCarousel(-1)">← Précédent</button>
                <button class="nav-btn" onclick="scrollCarousel(1)">Suivant →</button>
            </div>

            <div class="dots-indicator" id="dotsContainer">
            </div>
        </div>
    </main>

    <script>
        const carousel = document.getElementById('carousel');
        const dotsContainer = document.getElementById('dotsContainer');
        const cards = document.querySelectorAll('.travel-card');
        
        let currentIndex = 0;
        
        // Créer les indicateurs de points
        function createDots() {
            for (let i = 0; i < cards.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i === 0) dot.classList.add('active');
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            }
        }
        
        // Aller à une diapositive spécifique
        function goToSlide(index) {
            const cardWidth = cards[0].offsetWidth + 32; // largeur + gap
            carousel.scrollTo({
                left: index * cardWidth,
                behavior: 'smooth'
            });
            updateDots(index);
            currentIndex = index;
        }
        
        // Mettre à jour les indicateurs
        function updateDots(activeIndex) {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if (index === activeIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }
        
        // Navigation du carrousel
        function scrollCarousel(direction) {
            const maxIndex = cards.length - 1;
            
            if (direction === 1) {
                currentIndex = currentIndex >= maxIndex ? 0 : currentIndex + 1;
            } else {
                currentIndex = currentIndex <= 0 ? maxIndex : currentIndex - 1;
            }
            
            goToSlide(currentIndex);
        }
        
        // Détection du scroll pour mettre à jour les dots
        carousel.addEventListener('scroll', () => {
            const cardWidth = cards[0].offsetWidth + 32;
            const newIndex = Math.round(carousel.scrollLeft / cardWidth);
            if (newIndex !== currentIndex) {
                currentIndex = newIndex;
                updateDots(currentIndex);
            }
        });
        
        // Auto-scroll (optionnel)
        function autoScroll() {
            scrollCarousel(1);
        }
        
        // Décommenter pour activer l'auto-scroll toutes les 5 secondes
        // setInterval(autoScroll, 5000);
        
        // Initialisation
        createDots();
        
        // Support du clavier
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') scrollCarousel(-1);
            if (e.key === 'ArrowRight') scrollCarousel(1);
        });
    </script>
</body>
</html>
